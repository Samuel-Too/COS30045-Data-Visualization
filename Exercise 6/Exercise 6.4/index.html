<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Energy Consumption</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/visualisation.css">
</head>
<body>
  <header class="page-header">
    <div class="header-inner">
      <h1>TV Energy Consumption</h1>
    </div>
  </header>

  <main class="content-container">
    <section class="intro-section">
      <h2>Energy Consumption for different TV screen types and sizes</h2>
      <p class="subtitle">Most TV's on sale in Australia are LED and they vary considerably in energy consumption.</p>
    </section>

    <div id="filters_screen"></div>

    <div id="histogram"></div>

    <div id="filters_size"></div>

    <div id="scatterplot" class="responsive-svg-container"></div>

    <footer class="data-footer">
      <h3>Data source</h3>
      <p>
        <a href="https://www.energyrating.gov.au" target="_blank" rel="noopener noreferrer">
          Energy Rating Data for household appliances – Televisions
        </a>
      </p>
      <p>Downloaded Jan 2026</p>
      <p class="copyright">&copy; Data Visualisation Week 6</p>
    </footer>
  </main>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="js/shared-constants.js"></script>
  <script src="js/histogram.js"></script>
  <script src="js/scatterplot.js"></script>
  <script src="js/interactions.js"></script>
  <script src="js/load-data.js"></script>
</body>
</html>
